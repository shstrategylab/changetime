<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 괘 — 天地國市 4기운 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1208;--ink2:#3d2e14;--ink3:#7a6040;
  --gold:#c8922a;--goldl:#e8b84b;--goldd:#f5e8c8;
  --paper:#faf6ef;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#111009;color:#e8dcc0;min-height:100vh;padding:32px 20px;}

/* ── 상단 바 ── */
.top-bar{
  max-width:980px;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08);
}
.top-bar-left{display:flex;align-items:center;gap:10px;}
.top-label{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
.top-date{font-size:12px;color:#7a6040;}
.top-jeolgi{font-size:11px;color:rgba(200,146,42,.6);}
.syn-btn{
  background:rgba(200,146,42,.16);border:1px solid rgba(200,146,42,.38);
  color:var(--goldl);font-size:11px;letter-spacing:1.5px;padding:6px 16px;
  border-radius:3px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  transition:background .2s;
}
.syn-btn:hover{background:rgba(200,146,42,.32);}

/* ── 카드 그리드 ── */
.card-grid{
  max-width:980px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
}

/* ── 개별 카드 ── */
.dc-box{
  position:relative;overflow:hidden;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r);padding:20px 18px 18px;
  cursor:pointer;transition:border-color .2s,background .2s;
  min-height:220px;
}
.dc-box:hover{
  border-color:rgba(200,146,42,.5);
  background:rgba(200,146,42,.07);
}
.dc-bg-char{
  position:absolute;top:-8px;right:-4px;
  font-family:'Noto Serif KR',serif;font-size:96px;font-weight:700;
  color:rgba(255,255,255,.04);line-height:1;user-select:none;pointer-events:none;
}
.dc-label{font-size:9px;letter-spacing:2.5px;color:var(--gold);margin-bottom:4px;}
.dc-sub{font-size:10px;color:#7a6040;margin-bottom:14px;letter-spacing:.5px;min-height:14px;}
.dc-name{
  font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700;
  color:var(--goldl);line-height:1;margin-bottom:4px;
}
.dc-hanja{font-size:10px;color:#7a6040;letter-spacing:1px;margin-bottom:10px;}
.dc-kw-pill{
  display:inline-block;font-size:10px;letter-spacing:1.5px;
  background:rgba(200,146,42,.16);border:1px solid rgba(200,146,42,.3);
  color:var(--gold);padding:3px 10px;border-radius:2px;margin-bottom:12px;
}
.dc-desc{font-size:11px;color:#9a8e7a;line-height:1.8;}

/* ── 모달 배경 ── */
.mo{display:none;position:fixed;inset:0;background:rgba(10,8,4,.88);z-index:300;align-items:center;justify-content:center;padding:20px;}
.mo.on{display:flex;}
.md-dark{
  background:#1a1208;border:1px solid rgba(200,146,42,.2);
  border-radius:14px;max-width:540px;width:100%;max-height:88vh;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
}
.mdx{position:absolute;top:14px;right:18px;background:none;border:none;font-size:20px;color:#7a6040;cursor:pointer;}

/* 종합해석 스타일 */
#synBody::-webkit-scrollbar{width:4px;}
#synBody::-webkit-scrollbar-track{background:rgba(255,255,255,.02);}
#synBody::-webkit-scrollbar-thumb{background:rgba(200,146,42,.25);border-radius:2px;}
@keyframes breathe{0%,100%{opacity:.5;}50%{opacity:1;}}

/* 반응형 */
@media(max-width:680px){
  .card-grid{grid-template-columns:repeat(2,1fr)!important;}
  .dc-name{font-size:22px;}
}
@media(max-width:400px){
  .card-grid{grid-template-columns:1fr!important;}
}
</style>
</head>
<body>

<!-- 상단 바 -->
<div class="top-bar">
  <div class="top-bar-left">
    <span class="top-label">오늘의 괘</span>
    <span class="top-date" id="dailyTitle"></span>
    <span class="top-jeolgi" id="dailyJeolgi"></span>
  </div>
  <button class="syn-btn" onclick="openSyn()">☯&nbsp;종합해석</button>
</div>

<!-- 4박스 카드 그리드 -->
<div class="card-grid">

  <div class="dc-box" id="dcBox0" onclick="openDetail(0)">
    <div class="dc-bg-char">天</div>
    <div class="dc-label">천기 · 天氣</div>
    <div class="dc-sub" id="dcSub0">날씨 기운</div>
    <div class="dc-name" id="dcName0">—</div>
    <div class="dc-hanja" id="dcHanja0"></div>
    <div class="dc-kw-pill" id="dcKw0"></div>
    <div class="dc-desc" id="dcDesc0"></div>
  </div>

  <div class="dc-box" id="dcBox1" onclick="openDetail(1)">
    <div class="dc-bg-char">地</div>
    <div class="dc-label">지운 · 地運</div>
    <div class="dc-sub" id="dcSub1">절기 기운</div>
    <div class="dc-name" id="dcName1">—</div>
    <div class="dc-hanja" id="dcHanja1"></div>
    <div class="dc-kw-pill" id="dcKw1"></div>
    <div class="dc-desc" id="dcDesc1"></div>
  </div>

  <div class="dc-box" id="dcBox2" onclick="openDetail(2)">
    <div class="dc-bg-char">國</div>
    <div class="dc-label">국운 · 國運</div>
    <div class="dc-sub" id="dcSub2">사회 정세</div>
    <div class="dc-name" id="dcName2">—</div>
    <div class="dc-hanja" id="dcHanja2"></div>
    <div class="dc-kw-pill" id="dcKw2"></div>
    <div class="dc-desc" id="dcDesc2"></div>
  </div>

  <div class="dc-box" id="dcBox3" onclick="openDetail(3)">
    <div class="dc-bg-char">市</div>
    <div class="dc-label">시운 · 時運</div>
    <div class="dc-sub" id="dcSub3">경제 흐름</div>
    <div class="dc-name" id="dcName3">—</div>
    <div class="dc-hanja" id="dcHanja3"></div>
    <div class="dc-kw-pill" id="dcKw3"></div>
    <div class="dc-desc" id="dcDesc3"></div>
  </div>

</div>

<!-- ══ 개별 상세 모달 ══ -->
<div class="mo" id="detailMo">
  <div class="md-dark">
    <button class="mdx" onclick="closeMo('detailMo')">✕</button>
    <div style="padding:22px 26px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;">
      <p style="font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:5px;" id="gdEye"></p>
      <p style="font-size:11px;color:#7a6040;" id="gdSub"></p>
    </div>
    <div style="padding:18px 26px 0;flex-shrink:0;">
      <div style="display:flex;align-items:flex-end;gap:14px;margin-bottom:10px;">
        <span style="font-family:'Noto Serif KR',serif;font-size:40px;font-weight:700;color:var(--gold);line-height:1;" id="gdName">—</span>
        <div>
          <p style="font-size:11px;color:#7a6040;letter-spacing:1.5px;margin-bottom:4px;" id="gdHanja2"></p>
          <span style="display:inline-block;background:rgba(200,146,42,.18);border:1px solid rgba(200,146,42,.35);color:var(--goldl);font-size:10px;letter-spacing:2px;padding:3px 12px;border-radius:3px;" id="gdKw2"></span>
        </div>
      </div>
      <div id="gdCtxChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;"></div>
      <div style="height:1px;background:rgba(255,255,255,.07);"></div>
    </div>
    <div style="padding:16px 26px;overflow-y:auto;flex:1;" id="gdBody2"></div>
    <div style="margin:0 26px 22px;background:rgba(200,146,42,.1);border:1px solid rgba(200,146,42,.22);border-radius:8px;padding:13px 15px;flex-shrink:0;">
      <p style="font-size:9px;letter-spacing:2px;color:var(--gold);margin-bottom:6px;">오늘 이 기운 앞에서 취할 태도</p>
      <p style="font-size:13px;color:var(--goldl);line-height:1.85;font-family:'Noto Serif KR',serif;" id="gdAction2"></p>
    </div>
  </div>
</div>

<!-- ══ 종합해석 모달 ══ -->
<div class="mo" id="synMo">
  <div class="md-dark" style="max-width:620px;">
    <button class="mdx" onclick="closeMo('synMo')">✕</button>
    <div style="padding:24px 26px 16px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;">
      <p style="font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:6px;">CHEONJIIN · 天地人 三才</p>
      <h2 style="font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--goldl);margin-bottom:3px;">천지인 삼재 종합해석</h2>
      <p style="font-size:11px;color:#7a6040;" id="synDate"></p>
    </div>
    <div style="padding:14px 26px 0;flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap;" id="synBadges2"></div>
    <div style="margin:12px 26px 0;height:1px;background:rgba(255,255,255,.07);flex-shrink:0;"></div>
    <div id="synBody" style="padding:18px 26px 4px;overflow-y:auto;flex:1;"></div>
    <div id="synAct" style="display:none;margin:10px 26px 22px;background:rgba(200,146,42,.1);border:1px solid rgba(200,146,42,.22);border-radius:8px;padding:13px 15px;flex-shrink:0;">
      <p style="font-size:9px;letter-spacing:2px;color:var(--gold);margin-bottom:6px;">오늘 취해야 할 태도</p>
      <p style="font-size:13px;color:var(--goldl);line-height:1.85;font-family:'Noto Serif KR',serif;" id="synActTxt"></p>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════
   오늘의 괘 데이터 & 렌더링 (독립형)
   ════════════════════════════════════ */

// ── 64괘 기본 데이터 (핵심 20괘만, 나머지는 범용 처리) ──
const G64_MINI = {
  9:  {name:'풍천소축',hanja:'風天小畜',meaning:'바람 위 하늘',keyword:'소축',desc:'바람이 하늘 위에 있다. 작은 것이 큰 것을 막는 형세. 구름이 깔려도 비는 없다.',action:'작은 것 하나하나에 충실하십시오. 작은 노력이 쌓여 큰 결실을 맺습니다.'},
  29: {name:'중수감',hanja:'重水坎',meaning:'물 거듭',keyword:'위험',desc:'물이 거듭 흐른다. 깊은 위험과 시련의 기운. 원화 약세 1,518원대, 두 겹의 구덩이.',action:'포기하지 마십시오. 험난함 속에서도 믿음을 잃지 않으면 반드시 빠져나오는 길이 생깁니다.'},
  42: {name:'풍뢰익',hanja:'風雷益',meaning:'바람과 천둥',keyword:'더함',desc:'바람과 천둥이 함께한다. 위에서 덜어 아래를 더하는 증가의 기운. 망종 씨앗의 때.',action:'베풀고 선한 일을 할 때입니다. 이로운 방향으로 과감히 나아가십시오.'},
  54: {name:'뇌택귀매',hanja:'雷澤歸妹',meaning:'우레 아래 연못',keyword:'귀착',desc:'연못 위에 천둥이 있다. 분수에 맞는 자리로 귀착하는 기운. 때를 기다려야 할 때.',action:'자신의 위치와 역할을 분명히 하십시오. 처음에 신중하면 나중에 후회가 없습니다.'},
};

// ── 오늘 데이터 정의 ──
const _dgd = [
  { // 0: 천기
    id:9, label:'천기·天氣',
    wx:'구름조금', temp:'18~27°C',
    realCtx:'서울 · 구름조금, 최저 18°C / 최고 27°C',
    realDesc:'바람이 하늘 위를 지나는 형상 — 큰 비는 없으나 구름이 오가니 완전히 맑지도 않습니다. 잠시 막힌 듯 보여도 곧 순환합니다.'
  },
  { // 1: 지운
    id:42, label:'지운·地運',
    jg:'망종', di:7, nj:'하지',
    realCtx:'망종(芒種) 절기 7일째 · 씨앗을 심는 시기',
    realDesc:'망종은 보리를 거두고 모를 심는 절기입니다. 익괘(益)는 더함·유익의 괘 — 땅의 기운이 씨앗을 키우듯 지금 시작한 일에는 이로움이 더해집니다.'
  },
  { // 2: 국운
    id:54, label:'국운·國運',
    realCtx:'2026년 6월 · 월간 국운 시드',
    realDesc:'귀매(歸妹)는 "분수에 맞는 자리로 돌아감"의 괘입니다. 절차를 무시한 서두름을 경계하고, 각자의 위치와 역할을 분명히 할 때 국면이 안정됩니다.'
  },
  { // 3: 시운
    id:29, label:'시운·時運',
    krw:'1,518원',
    realCtx:'USD/KRW 1,518원대 · 원화 강한 약세',
    realDesc:'감괘(坎)는 험난한 물길이 거듭되는 위험의 괘입니다. 달러 강세·원화 약세가 지속되는 지금, 섣불리 나서기보다 진실한 마음으로 버티면 반드시 돌파구가 생깁니다.'
  }
];

const EYES=['CHEONGI · 天氣','JIUN · 地運','GUGUN · 國運','SIUN · 時運'];
const SUBS=['날씨 기운','절기 기운','사회 정세','경제 흐름'];
const SYN_LABELS=['천기·天氣','지운·地運','국운·國運','시운·時運'];

function getG(id){ return G64_MINI[id] || {name:'—',hanja:'',meaning:'',keyword:'',desc:'',action:''}; }

/* 초기 렌더 */
function render(){
  const now = new Date();
  const ds = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${['일','월','화','수','목','금','토'][now.getDay()]}`;
  document.getElementById('dailyTitle').textContent = ds;

  const jg = _dgd[1];
  if(jg?.jg){
    const nxDate = new Date(now.getFullYear(), 5, 21); // 하지 6/21 근사
    const daysLeft = Math.ceil((nxDate - now) / 86400000);
    document.getElementById('dailyJeolgi').textContent = `${jg.jg} 절기 ${jg.di}일째 · ${jg.nj}까지 ${Math.max(0,daysLeft)}일`;
  }

  _dgd.forEach((d, i) => {
    const g = getG(d.id);
    const set = (sfx, val) => { const el = document.getElementById(sfx+i); if(el) el.textContent = val||''; };
    set('dcName', g.name);
    set('dcHanja', (g.hanja||'')+(g.meaning?' · '+g.meaning:''));
    set('dcKw', g.keyword);
    set('dcDesc', g.desc);

    const subEl = document.getElementById('dcSub'+i);
    if(subEl){
      if(i===0 && d.wx)       subEl.textContent = d.wx + (d.temp ? ' '+d.temp : '');
      else if(i===1 && d.jg)  subEl.textContent = d.jg + ' 절기 ' + d.di + '일째';
      else if(i===3 && d.krw) subEl.textContent = 'USD/KRW ' + d.krw;
      else                    subEl.textContent = SUBS[i];
    }
  });

  // 실시간 API
  fetchWeather();
  fetchFX();
}

function fetchWeather(){
  fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min&timezone=Asia/Seoul')
    .then(r=>r.json()).then(data=>{
      const w = data.current;
      const tmax = data.daily?.temperature_2m_max?.[0];
      const tmin = data.daily?.temperature_2m_min?.[0];
      const wl = w.weathercode===0?'맑음':w.weathercode<=3?'구름조금':w.weathercode<=48?'흐림':w.weathercode<=67?'비':'소나기';
      const tr = (tmin!=null&&tmax!=null)?`${Math.round(tmin)}~${Math.round(tmax)}°C`:`${Math.round(w.temperature_2m)}°C`;
      // 날씨 코드 → 괘 id
      const wc = w.weathercode, wt = w.temperature_2m;
      let wid; if(wc===0)wid=wt>30?29:1; else if(wc<=3)wid=wt<5?6:9; else if(wc<=48)wid=29; else if(wc<=67)wid=39; else wid=40;
      const wDescMap = {'맑음':'맑은 하늘의 순수한 기운이 흐릅니다. 에너지가 충만하니 결단하기 좋은 날입니다.','구름조금':'바람이 하늘 위를 지나는 형상 — 큰 비는 없으나 구름이 오가니 완전히 맑지도 않습니다. 잠시 막힌 듯 보여도 곧 순환합니다.','흐림':'하늘이 두꺼운 구름에 덮인 형세입니다. 섣불리 나서기보다 상황을 관찰하며 때를 기다리십시오.','비':'비가 내려 땅을 적시는 형세입니다. 유연하게 대처하십시오.','소나기':'갑작스러운 소나기처럼 충격이 오더라도 흔들리지 마십시오.'};
      Object.assign(_dgd[0], { id:wid, wx:wl, temp:tr, realCtx:`서울 · ${wl}, ${tr}`, realDesc:wDescMap[wl]||_dgd[0].realDesc });
      // 카드 업데이트
      const g = getG(wid);
      ['dcName','dcHanja','dcKw','dcDesc'].forEach(k => {
        const el = document.getElementById(k+'0');
        if(el) el.textContent = k==='dcName'?g.name:k==='dcHanja'?(g.hanja+(g.meaning?' · '+g.meaning:'')):k==='dcKw'?g.keyword:g.desc;
      });
      const sub0 = document.getElementById('dcSub0');
      if(sub0) sub0.textContent = wl + ' ' + tr;
    }).catch(()=>{});
}

function fetchFX(){
  fetch('https://api.frankfurter.app/latest?from=USD&to=KRW')
    .then(r=>r.json()).then(data=>{
      const krw = data.rates?.KRW;
      if(!krw) return;
      let fid; if(krw>1450)fid=29; else if(krw>1400)fid=29; else if(krw>1350)fid=12; else if(krw>1300)fid=47; else if(krw>1250)fid=11; else fid=14;
      const krwStr = Math.round(krw).toLocaleString()+'원';
      const trend = krw>1450?'극도 약세':krw>1400?'강한 약세':krw>1350?'약세':krw>1300?'보통':krw>1250?'강세':'강한 강세';
      const fxDesc = {'극도 약세':'원화가 극도로 약세인 지금, 감괘의 험난함이 시장을 지배합니다.','강한 약세':'감괘(坎)는 험난한 물길이 거듭되는 위험의 괘입니다. 달러 강세·원화 약세 국면에서 버티면 반드시 돌파구가 생깁니다.','약세':'비괘(否)의 막힘처럼 원화가 눌려 있습니다. 억지로 추진하기보다 내실을 다지십시오.','보통':'환율이 안정된 구간입니다. 말보다 행동으로 증명할 때입니다.','강세':'태괘(泰)의 소통처럼 원화 강세가 흐름을 뚫었습니다.','강한 강세':'대유괘(大有)의 풍요처럼 원화가 강합니다.'};
      Object.assign(_dgd[3], { id:fid, krw:krwStr, realCtx:`USD/KRW ${krwStr} · 원화 ${trend}`, realDesc:fxDesc[trend]||_dgd[3].realDesc });
      const g = getG(fid);
      ['dcName','dcHanja','dcKw','dcDesc'].forEach(k => {
        const el = document.getElementById(k+'3');
        if(el) el.textContent = k==='dcName'?g.name:k==='dcHanja'?(g.hanja+(g.meaning?' · '+g.meaning:'')):k==='dcKw'?g.keyword:g.desc;
      });
      const sub3 = document.getElementById('dcSub3');
      if(sub3) sub3.textContent = 'USD/KRW ' + krwStr;
    }).catch(()=>{});
}

/* 개별 상세 모달 */
function openDetail(idx){
  const d = _dgd[idx];
  const g = getG(d.id);
  document.getElementById('gdEye').textContent   = EYES[idx];
  document.getElementById('gdSub').textContent   = d.label + ' — 오늘의 외부 기운';
  document.getElementById('gdName').textContent  = g.name;
  document.getElementById('gdHanja2').textContent= (g.hanja||'')+(g.meaning?' · '+g.meaning:'');
  document.getElementById('gdKw2').textContent   = g.keyword;
  document.getElementById('gdAction2').textContent = g.action;

  const chips = [];
  if(d.realCtx) chips.push(d.realCtx);
  document.getElementById('gdCtxChips').innerHTML = chips.map(c=>
    `<span style="font-size:10px;color:#7a6040;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:3px 10px;border-radius:12px;">${c}</span>`
  ).join('');

  document.getElementById('gdBody2').innerHTML = `
    ${d.realDesc?`<p style="font-size:9px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;">오늘의 형세</p>
    <p style="font-family:'Noto Serif KR',serif;font-size:13px;color:#d4b87a;line-height:1.95;margin-bottom:16px;">${d.realDesc}</p>`:''}
    <p style="font-size:9px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;">괘의 본뜻</p>
    <p style="font-size:13px;color:#c8b898;line-height:1.9;">${g.desc||''}</p>
  `;
  openMo('detailMo');
}

/* 종합해석 */
async function openSyn(){
  openMo('synMo');
  const now = new Date();
  const ds = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;
  document.getElementById('synDate').textContent = ds + ' · 하늘 · 땅 · 나라 · 시장 — 오늘의 외부 형세';

  document.getElementById('synBadges2').innerHTML = _dgd.map((d,i)=>{
    const g=getG(d.id);
    return `<div style="display:inline-flex;align-items:center;gap:5px;background:rgba(200,146,42,.13);border:1px solid rgba(200,146,42,.26);border-radius:3px;padding:4px 11px;">
      <span style="font-size:9px;letter-spacing:1px;color:#7a6040;">${SYN_LABELS[i].split('·')[0]}</span>
      <span style="font-family:'Noto Serif KR',serif;font-size:13px;font-weight:700;color:var(--goldl);">${g.name}</span>
      <span style="font-size:9px;color:var(--gold);">${g.keyword}</span>
    </div>`;
  }).join('');

  const bodyEl = document.getElementById('synBody');
  const actEl  = document.getElementById('synAct');
  bodyEl.innerHTML = `<p style="font-family:'Noto Serif KR',serif;font-size:13px;color:#7a6040;text-align:center;padding:40px 0;animation:breathe 2s infinite;">네 기운을 종합하는 중…</p>`;
  actEl.style.display = 'none';

  const parts = _dgd.map((d,i)=>{
    const g=getG(d.id);
    let ex = d.realCtx ? ` (${d.realCtx})` : '';
    const extraDesc = d.realDesc ? ` 맥락: ${d.realDesc}` : '';
    return `${SYN_LABELS[i]} — ${g.name}(${g.hanja||''}), 키워드: ${g.keyword}. ${g.desc}${extraDesc} 취할 태도: ${g.action}${ex}`;
  }).join('\n');

  const prompt = `오늘은 ${ds}입니다. 천지인(天地人) 삼재 사상에 근거한 오늘의 네 괘 정보:\n\n${parts}\n\n위 네 기운(천기·지운·국운·시운)을 종합하여 오늘 하루의 전체 형세를 고전적이고 시적인 문체로 해석하십시오.\n반드시 아래 JSON만 출력하십시오(마크다운·코드블록 없이):\n{"interpretation":"200~280자 종합 해석. 네 괘가 서로 얽히는 흐름을 설명. 단락 구분은 \\n\\n 사용.","action":"오늘 취해야 할 핵심 태도 40자 이내 한 문장"}`;

  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const data = await resp.json();
    const raw  = (data.content||[]).map(b=>b.text||'').join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
    bodyEl.innerHTML = `<p style="font-family:'Noto Serif KR',serif;font-size:14px;color:#c8b090;line-height:2.1;white-space:pre-line;">${parsed.interpretation||''}</p>`;
    if(parsed.action){
      document.getElementById('synActTxt').textContent = parsed.action;
      actEl.style.display = 'block';
    }
  } catch(e){
    bodyEl.innerHTML = `<p style="font-size:13px;color:#7a6040;text-align:center;padding:40px 0;">해석을 불러오지 못했습니다.<br><span style="font-size:11px;opacity:.6;">잠시 후 다시 시도해 주세요.</span></p>`;
  }
}

function openMo(id){ document.getElementById(id).classList.add('on'); }
function closeMo(id){ document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('.mo').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('on');}));

// 실행
render();
</script>
